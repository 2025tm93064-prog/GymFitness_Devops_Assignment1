apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness
      version: variant-a
  template:
    metadata:
      labels:
        app: aceest-fitness
        version: variant-a
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U "$DB_USER"; do sleep 2; done
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: aceest-db
                  key: DB_USER
      containers:
        - name: app
          image: aceest-variant-a:v1.3.1
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: aceest-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: aceest-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aceest-db
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
