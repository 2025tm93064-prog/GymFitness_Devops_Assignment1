apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: aceest-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - aceest.local
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: aceest-service
spec:
  host: aceest-service
  subsets:
    - name: variant-a
      labels:
        version: variant-a
    - name: variant-b
      labels:
        version: variant-b
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: aceest-service
spec:
  hosts:
    - aceest.local
  gateways:
    - aceest-gateway
  http:
    - match:
        - headers:
            x-aceest-cohort:
              exact: B
      route:
        - destination:
            host: aceest-service
            subset: variant-b
    - route:
        - destination:
            host: aceest-service
            subset: variant-a
