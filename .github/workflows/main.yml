name: CI

on:
  push:
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8

      - name: Check syntax
        run: python -m compileall -q app.py tests

      - name: Lint
        run: flake8 app.py tests --max-line-length=100

  docker-test:
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aceest-fitness .

      - name: Run Pytest inside the container
        run: docker run --rm aceest-fitness python -m pytest
